# TARGET SHAPE for a YAML-defined workflow — not yet loadable.
#
# The parser does not exist. This file is the specification for it, written
# against the *real* `Step` and `Template` contracts rather than invented ones,
# so building the loader is a parser and not a redesign. (The previous version
# of this file used five executors that do not exist; this one does not.)
#
# What changes when this lands: `templates/kyc_onboarding.py` stops declaring the
# pipeline and keeps only the functions. Orchestration moves here; behaviour
# stays in Python. They are different jobs and this separates them.
#
#   templates/kyc_onboarding.py       this file
#   ────────────────────────────      ─────────────────────────
#   what each step *does*             what runs, in what order
#   registered under a `uses` name    which function each step uses
#   ordinary Python, ordinary tests   reviewable as a diff

name: kyc-onboarding
doc: Screen a prospective client and assign an eligibility tier.

# ── the input edge ───────────────────────────────────────────────────────────
# A bare string is shorthand for a required string, exactly as in Python.
params:
  - name: client_id
    type: string
    required: true
    doc: Client to screen — see data/clients.json

# ── the output edge ──────────────────────────────────────────────────────────
publishes: outcome
result_schema: onboarding-outcome

prompt_refs:
  - kyc-entities@1
  - kyc-adjudicate@1

# ── the pipeline ─────────────────────────────────────────────────────────────
# `uses` is the functional interface: it names an implementation registered in
# Python with @implementation("kyc.load_client"). This is what makes a step
# expressible as data — the field exists in `Step` today for exactly this
# reason, and its docstring says so.
#
# A workflow `.py` file may still override any step by defining a function with
# the step's name, so the override mechanism is unchanged.
steps:
  - name: load_client
    executor: local
    produces: client
    kwargs: [client_id]
    uses: kyc.load_client
    summary_keys: [client_id, name]
    doc: fetch the client's identity record

  - name: validate_jurisdiction
    executor: local
    produces: jurisdiction
    kwargs: [client]
    uses: kyc.validate_jurisdiction
    doc: a missing country blocks the run rather than passing it

  - name: extract_entities
    executor: agent
    produces: mentions
    kwargs: [client]
    uses: kyc.extract_entities
    doc: index proper names across the article corpus; no judgement

  - name: adjudicate_media
    executor: agent
    produces: adverse_media
    kwargs: [client, mentions]
    uses: kyc.adjudicate_media
    doc: is it adverse, and is the subject implicated or merely present?
    # When fan-out lands (DESIGN-WRK-001 §3.4) this gains:
    #   for_each: candidate_articles
    #   max_parallel: 8

  - name: pep_check
    executor: local
    produces: pep
    kwargs: [client]
    uses: kyc.pep_check
    summary_keys: [is_pep]
    doc: exact lookup against the PEP register

  # A gate needs no `uses` — the engine implements it. `kwargs` is what the
  # reviewer is shown, and `when` decides whether the gate is material at all.
  - name: pep_gate
    executor: gate
    produces: pep_decision
    when: pep.is_pep
    kwargs: [client, pep, adverse_media]
    doc: a PEP match is a decision a compliance officer owns, not a rejection

  - name: sanctions_check
    executor: local
    produces: sanctions
    kwargs: [client, client_id]
    uses: kyc.sanctions_check
    summary_keys: [country, basis]
    doc: resolve the relevant jurisdiction, then screen country and individual

  - name: compute_eligibility
    executor: local
    produces: eligibility
    kwargs: [client, client_id]
    uses: kyc.compute_eligibility
    summary_keys: [tier]
    doc: threshold arithmetic over income, savings and assets

  - name: art_gate
    executor: gate
    produces: art_decision
    when: eligibility.has_art
    kwargs: [client, eligibility]
    doc: art needs an attestation — historian review, provenance, no theft claim

  - name: emit_outcome
    executor: local
    produces: outcome
    kwargs:
      - client
      - adverse_media
      - pep
      - sanctions
      - eligibility
      - pep_decision
      - art_decision
    uses: kyc.emit_outcome
    summary_keys: [client_id, tier]
    doc: assemble the onboarding record

# ── open questions for the parser ────────────────────────────────────────────
#
# 1. Where do `uses` names get registered? A project needs a module the loader
#    imports for its side effects. `[paths] implementations = "steps"` in the
#    manifest is the obvious answer and keeps registration explicit rather than
#    magic. Note this means the *loader* imports project Python — fine in the
#    CLI and the worker, and never in the API (DESIGN-WRK-001 §1).
#
# 2. What happens when a `uses` name is not registered? It must fail at **load**,
#    naming the known implementations — the same treatment a missing hook gets
#    today. A run that reaches step seven and only then cannot resolve it is the
#    worst version of this.
#
# 3. JSON as well as YAML? The parser should take either. They are the same
#    document model and refusing JSON buys nothing.
#
# 4. Does a YAML template compose with a Python one? Simplest first answer is
#    no — a template is defined in one place or the other. Mixing is a feature
#    nobody has asked for.
#
# 5. Prompts stay refs (`kyc-entities@1`), not inline text. Versioned prompt
#    data already has a home and a second one would rot.
