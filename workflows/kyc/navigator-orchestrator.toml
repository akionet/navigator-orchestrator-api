# The workflow project manifest.
#
# A workflow project is *a directory with this file in it* — not a Python
# package. The CLI finds it by walking up from wherever you run it, the way git
# finds `.git`. Adding a judge means adding a file; there is no install step and
# no reinstall after an edit.
#
# This is the file that makes `workflows/kyc/` a project rather than a folder of
# examples. Copy this directory, change the paths and backends, and you have your
# own workflow — see ../README.md.

# The published result's shape, so a console can render a table rather than a
# JSON dump. This is the output *edge* — nothing that flows between the steps is
# described here, and nothing should be.
[schemas.onboarding-outcome]
backend = "local"
method  = "POST"
path    = "schemas/onboarding-outcome.json"
source  = "file"

[paths]
schemas   = "schemas"    # runtime contracts at the edges
flows     = "flows"      # workflow definitions: what runs, in what order
# judges  = "judges"     # single-hop compliance gates, if the project needs any
prompts   = "prompts"    # versioned prompt text (this example inlines its prompts)
templates = "templates"  # reusable step shapes, if the project needs any

# Backends this project may call. Declared here so a step can name one and a
# reviewer can see every external system the workflow touches in one place.
#
# No secrets. `token_env` names environment variables — first one *set* wins —
# and the value lives in the environment, never in a file git can see.
#
# The KYC example is fully offline: it reads the JSON fixtures under `data/` and
# `reference/` and calls nothing. This block is here to show the shape a real
# project needs, and is commented out so the example stays hermetic.

# [backends.client-service]
# base_url  = "${CLIENT_API_URL:-https://api.example.com}"
# token_env = ["CLIENT_SERVICE_TOKEN"]
# timeout   = 30.0

# [backends.sanctions-feed]
# base_url  = "${SANCTIONS_API_URL:-https://api.example.com}"
