[mypy]
python_version = 3.12
strict = True
mypy_path = src
packages = navigator_orchestrator
warn_unreachable = True
show_error_codes = True
plugins = pydantic.mypy

# Optional providers / infra drivers are extras; they may be absent locally.
[mypy-boto3.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-langfuse.*]
ignore_missing_imports = True

[mypy-langgraph.*]
ignore_missing_imports = True

[mypy-langgraph_checkpoint.*]
ignore_missing_imports = True

[mypy-psycopg.*]
ignore_missing_imports = True
